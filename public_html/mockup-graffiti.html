<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MISE – Graffiti Font Mockup</title>
<link href="https://fonts.cdnfonts.com/css/a-dripping-marker" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0a0a0a;
  display:flex;
  justify-content:center;
  gap:24px;
  padding:20px;
  min-height:100vh;
  align-items:flex-start;
}
.phone {
  width:375px;
  height:812px;
  border-radius:40px;
  overflow:hidden;
  border:3px solid #333;
  flex-shrink:0;
  position:relative;
  background: linear-gradient(180deg, #1a0520 0%, #3d0a2a 25%, #1a0a30 50%, #0a0a1a 75%, #0a0a0a 100%);
}
.content {
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding: 0 20px 28px;
}
.badge {
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-family:'Space Grotesk',sans-serif;
  font-size:11px;
  letter-spacing:0.15em;
  color:#E5B80B;
  border:1px solid rgba(229,184,11,0.3);
  border-radius:999px;
  padding:6px 14px;
  margin-bottom:12px;
}
.title-graffiti {
  font-family:'a dripping marker',cursive;
  font-size:3.2rem;
  line-height:1.05;
  color:#fff;
  margin-bottom:20px;
}
.title-barlow {
  font-family:'Barlow Condensed',sans-serif;
  font-weight:800;
  font-size:3.5rem;
  line-height:0.95;
  letter-spacing:-0.02em;
  text-transform:uppercase;
  color:#fff;
  margin-bottom:20px;
}
.gold { color:#E5B80B; }
.btn {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  padding:14px 24px;
  background:#E5B80B;
  color:#0a0a0a;
  font-family:'Space Grotesk',sans-serif;
  font-weight:600;
  font-size:0.95rem;
  letter-spacing:0.05em;
  border-radius:999px;
  border:none;
}
.label {
  text-align:center;
  color:#666;
  font-family:'Space Grotesk',sans-serif;
  font-size:11px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  margin-top:12px;
}
@media (max-width:799px) {
  body { flex-direction:column; align-items:center; }
}
</style>
</head>
<body>

<div>
  <div class="phone">
    <div class="content">
      <div class="badge">☀ NEO-SOUL · JAZZ · HIP-HOP</div>
      <div class="title-graffiti">MUSIC AS A DIRECT EXTENSION <span class="gold">OF THE SELF</span></div>
      <button class="btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
        LISTEN ON SPOTIFY
      </button>
    </div>
  </div>
  <div class="label">A Dripping Marker</div>
</div>

<div>
  <div class="phone">
    <div class="content">
      <div class="badge">☀ NEO-SOUL · JAZZ · HIP-HOP</div>
      <div class="title-barlow">MUSIC AS A DIRECT EXTENSION <span class="gold">OF THE SELF</span></div>
      <button class="btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
        LISTEN ON SPOTIFY
      </button>
    </div>
  </div>
  <div class="label">Current (Barlow Condensed)</div>
</div>

</body>
</html>
